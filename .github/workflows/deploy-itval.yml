name: Deploy ITVAL

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itval-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ITVAL to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear identificador de versión
        id: release
        shell: bash
        run: |
          set -euo pipefail

          echo "name=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" \
            >> "$GITHUB_OUTPUT"

      - name: Configurar conexión SSH
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "$VPS_SSH_KEY_B64" ]; then
            echo "ERROR: el secreto VPS_SSH_KEY_B64 está vacío."
            exit 1
          fi

          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "ERROR: el secreto VPS_KNOWN_HOSTS está vacío."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"

          printf '%s' "$VPS_SSH_KEY_B64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$VPS_KNOWN_HOSTS" \
            | tr -d '\r' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "Llave SSH decodificada y validada correctamente."

      - name: Verificar usuario y preparar versión
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail

          if [ "$VPS_USER" != "itval" ]; then
            echo "ERROR: VPS_USER debe ser exactamente itval."
            exit 1
          fi

          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE='$RELEASE' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          ROOT="/var/www/itval"
          RELEASE_DIR="$ROOT/releases/$RELEASE"

          echo "===== VALIDACIÓN INICIAL ====="

          test "$(id -un)" = "itval"
          test "$ROOT" = "/var/www/itval"
          test -w "$ROOT"
          test ! -w /var/www/eudora

          mkdir -p "$RELEASE_DIR"

          echo "Usuario remoto: $(id -un)"
          echo "Destino: $RELEASE_DIR"
          echo "Eudora permanece protegida."
          REMOTE

      - name: Subir código de ITVAL
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail

          if [ "$VPS_USER" != "itval" ]; then
            echo "ERROR: VPS_USER debe ser exactamente itval."
            exit 1
          fi

          rsync \
            -az \
            --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="node_modules/" \
            --exclude=".next/" \
            --exclude="out/" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="*.log" \
            --exclude="public/images/projects/" \
            --exclude="public/images/products/" \
            -e "ssh -p $VPS_PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ \
            "$VPS_USER@$VPS_HOST:/var/www/itval/releases/$RELEASE/"

      - name: Instalar, compilar y activar ITVAL
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail

          if [ "$VPS_USER" != "itval" ]; then
            echo "ERROR: VPS_USER debe ser exactamente itval."
            exit 1
          fi

          ssh \
            -p "$VPS_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "RELEASE='$RELEASE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          umask 027

          ROOT="/var/www/itval"
          RELEASE_DIR="$ROOT/releases/$RELEASE"
          ENV_FILE="$ROOT/shared/.env.production.local"
          SHARED_IMAGES="$ROOT/shared/images"
          ECOSYSTEM_FILE="$ROOT/ecosystem.config.cjs"

          export HOME="/home/itval"
          export PM2_HOME="/home/itval/.pm2"
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

          echo "===== VALIDACIÓN DE SEGURIDAD ====="

          test "$(id -un)" = "itval"
          test "$ROOT" = "/var/www/itval"
          test -d "$RELEASE_DIR"
          test -s "$ENV_FILE"
          test -f "$ECOSYSTEM_FILE"
          test ! -w /var/www/eudora

          test "$(stat -c '%U' "$ENV_FILE")" = "itval"
          ENV_MODE="$(stat -c '%a' "$ENV_FILE")"
          if [ "$ENV_MODE" != "600" ]; then
            echo "AVISO: permisos de ENV eran $ENV_MODE; corrigiendo a 600"
            chmod 600 "$ENV_FILE"
          fi
          test "$(stat -c '%a' "$ENV_FILE")" = "600"

          for VARIABLE in DATABASE_URL ADMIN_PASSWORD ADMIN_SECRET; do
            if ! grep -qE "^${VARIABLE}=.+" "$ENV_FILE"; then
              echo "ERROR: falta la variable $VARIABLE."
              exit 1
            fi
          done

          echo "Usuario: $(id -un)"
          echo "Destino: $RELEASE_DIR"
          echo "Variables privadas: verificadas"
          echo "Eudora: sin permisos de escritura"

          PREVIOUS_RELEASE="$(
            readlink -f "$ROOT/current" 2>/dev/null || true
          )"

          echo "===== IMÁGENES PERSISTENTES (shared + ruta ITVAL_IMAGES_ROOT) ====="

          mkdir -p "$SHARED_IMAGES"

          # Si una release antigua aún tenía public/images real (no symlink),
          # recupérala una sola vez hacia shared.
          if [ -n "$PREVIOUS_RELEASE" ] &&
             [ -d "$PREVIOUS_RELEASE/public/images" ] &&
             [ ! -L "$PREVIOUS_RELEASE/public/images" ]; then
            echo "Migrando imágenes de la release anterior (única vez)..."
            rsync -a "$PREVIOUS_RELEASE/public/images/" "$SHARED_IMAGES/"
          fi

          # Incorporar placeholders/pages del release a shared antes de sustituir.
          if [ -d "$RELEASE_DIR/public/images" ] &&
             [ ! -L "$RELEASE_DIR/public/images" ]; then
            rsync -a "$RELEASE_DIR/public/images/" "$SHARED_IMAGES/"
            rm -rf "$RELEASE_DIR/public/images"
          elif [ -L "$RELEASE_DIR/public/images" ]; then
            rm -f "$RELEASE_DIR/public/images"
          fi

          mkdir -p "$RELEASE_DIR/public"
          # Symlink para herramientas/fs; HTTP se sirve vía /api/media/file (rewrite).
          ln -sfn "$SHARED_IMAGES" "$RELEASE_DIR/public/images"

          if [ ! -e "$RELEASE_DIR/public/images" ]; then
            echo "ERROR: no se pudo vincular public/images -> $SHARED_IMAGES"
            exit 1
          fi

          # Prefer shared/images for uploads and /api/media/file.
          # Avoid sed -i here: with umask 027 it can change ENV mode away from 600.
          if grep -qE '^ITVAL_IMAGES_ROOT=' "$ENV_FILE"; then
            TMP_ENV="$(mktemp)"
            grep -vE '^ITVAL_IMAGES_ROOT=' "$ENV_FILE" > "$TMP_ENV"
            printf 'ITVAL_IMAGES_ROOT=%s
' "$SHARED_IMAGES" >> "$TMP_ENV"
            chmod 600 "$TMP_ENV"
            chown --reference="$ENV_FILE" "$TMP_ENV" 2>/dev/null || true
            mv -f "$TMP_ENV" "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo "Actualizado ITVAL_IMAGES_ROOT=$SHARED_IMAGES"
          else
            printf '
ITVAL_IMAGES_ROOT=%s
' "$SHARED_IMAGES" >> "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo "Anadido ITVAL_IMAGES_ROOT=$SHARED_IMAGES"
          fi

          export ITVAL_IMAGES_ROOT="$SHARED_IMAGES"

          echo "Imágenes compartidas: $SHARED_IMAGES"
          echo "Symlink: $(readlink -f "$RELEASE_DIR/public/images" 2>/dev/null || true)"
          echo "Archivos en shared: $(find "$SHARED_IMAGES" -type f 2>/dev/null | wc -l)"

          echo "===== VINCULANDO VARIABLES ====="

          ln -sfn \
            "$ENV_FILE" \
            "$RELEASE_DIR/.env.local"

          ln -sfn \
            "$ENV_FILE" \
            "$RELEASE_DIR/.env.production.local"

          cd "$RELEASE_DIR"

          echo "===== INSTALANDO DEPENDENCIAS ====="

          npm ci --include=dev

          echo "===== VERIFICANDO BASE DE DATOS ====="

          DATABASE_URL_VALUE="$(
            sed -n 's/^DATABASE_URL=//p' "$ENV_FILE" \
              | tail -n 1
          )"

          if [ -z "$DATABASE_URL_VALUE" ]; then
            echo "ERROR: DATABASE_URL está vacía."
            exit 1
          fi

          DB_IDENTITY="$(
            psql \
              "$DATABASE_URL_VALUE" \
              -Atqc \
              "SELECT current_database() || '|' || current_user;"
          )"

          if [ "$DB_IDENTITY" != "itval_db|itval_app" ]; then
            echo "ERROR: la conexión no apunta a itval_db con itval_app."
            echo "Identidad recibida: $DB_IDENTITY"
            exit 1
          fi

          unset DATABASE_URL_VALUE

          echo "Base confirmada: itval_db"
          echo "Usuario confirmado: itval_app"

          echo "===== APLICANDO ESQUEMA DE ITVAL ====="

          npm run db:schema

          echo "===== SEMBRANDO DATOS SI LA BASE ESTÁ VACÍA ====="

          # Si no hay obras en Postgres, importar el portafolio del repo
          # (galerías reales por ciudad). Evita “0 obras” tras db:export.
          PROJECT_COUNT="$(
            psql \
              "$(sed -n 's/^DATABASE_URL=//p' "$ENV_FILE" | tail -n 1)" \
              -Atqc \
              "SELECT COUNT(*)::text FROM projects;"
          )"

          echo "Obras en Postgres: $PROJECT_COUNT"

          if [ "${PROJECT_COUNT:-0}" = "0" ]; then
            echo "Importando obras del portafolio JSON → Postgres (sin tocar catálogo)…"
            npm run db:seed-projects
          fi

          echo "===== UNIFICANDO OBRAS DUPLICADAS Y LIMPIANDO FOTOS HUÉRFANAS ====="

          # Une ids …-2 (misma obra) y borra project_images sin archivo en disco.
          # Corre en el VPS (shared/images + Postgres), no desde el PC de desarrollo.
          npm run db:merge-projects

          echo "===== SINCRONIZANDO POSTGRES → JSON ====="

          npm run db:export

          echo "===== VALIDANDO KEYS DEL HUB DE PRODUCTOS ====="

          npm run catalog:validate-hub

          echo "===== COMPILANDO NEXT.JS ====="

          npm run build

          if [ ! -d ".next" ]; then
            echo "ERROR: npm run build no generó la carpeta .next."
            exit 1
          fi

          echo "===== ACTIVANDO NUEVA VERSIÓN ====="

          ln -sfn \
            "$RELEASE_DIR" \
            "$ROOT/current.next"

          mv -Tf \
            "$ROOT/current.next" \
            "$ROOT/current"

          echo "Versión activa: $(readlink -f "$ROOT/current")"

          echo "===== INICIANDO PM2 DE ITVAL ====="

          pm2 startOrReload \
            "$ECOSYSTEM_FILE" \
            --only itval-web \
            --update-env

          echo "===== COMPROBANDO ITVAL ====="

          HEALTH_OK=0

          for ATTEMPT in $(seq 1 20); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "http://localhost:3001/es" \
              > /dev/null; then

              HEALTH_OK=1
              break
            fi

            echo "Intento $ATTEMPT: esperando a ITVAL..."
            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "ERROR: ITVAL no respondió correctamente en localhost:3001/es."

            pm2 logs \
              itval-web \
              --lines 50 \
              --nostream \
              || true

            if [ -n "$PREVIOUS_RELEASE" ] &&
               [ -d "$PREVIOUS_RELEASE" ]; then

              echo "Restaurando versión anterior: $PREVIOUS_RELEASE"

              ln -sfn \
                "$PREVIOUS_RELEASE" \
                "$ROOT/current.rollback"

              mv -Tf \
                "$ROOT/current.rollback" \
                "$ROOT/current"

              pm2 startOrReload \
                "$ECOSYSTEM_FILE" \
                --only itval-web \
                --update-env

              pm2 save
            else
              echo "No existe una versión anterior para restaurar."

              pm2 delete itval-web || true
              rm -f "$ROOT/current"
            fi

            exit 1
          fi

          echo "===== COMPROBANDO SERVICIO DE IMÁGENES ====="

          MEDIA_OK=0
          for ATTEMPT in $(seq 1 10); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "http://localhost:3001/api/media/file?path=pages/products.jpg" \
              -o /tmp/itval-media-probe.jpg &&
              [ -s /tmp/itval-media-probe.jpg ]; then
              MEDIA_OK=1
              break
            fi
            echo "Intento $ATTEMPT: esperando /api/media/file..."
            sleep 2
          done

          if [ "$MEDIA_OK" -ne 1 ]; then
            echo "ERROR: /api/media/file no sirve imágenes desde ITVAL_IMAGES_ROOT."
            pm2 logs itval-web --lines 80 --nostream || true
            exit 1
          fi

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            "http://localhost:3001/images/pages/products.jpg" \
            -o /tmp/itval-images-rewrite.jpg ||
            [ ! -s /tmp/itval-images-rewrite.jpg ]; then
            echo "ERROR: rewrite /images/* → /api/media/file no funciona."
            pm2 logs itval-web --lines 80 --nostream || true
            exit 1
          fi

          echo "Servicio de imágenes OK (API + rewrite /images)."

          echo "===== GUARDANDO CONFIGURACIÓN PM2 ====="

          pm2 save

          echo "===== LIMPIANDO VERSIONES ANTIGUAS ====="

          cd "$ROOT/releases"

          ls -1dt -- */ 2>/dev/null \
            | tail -n +4 \
            | xargs -r rm -rf --

          echo "===== RESULTADO ====="

          echo "ITVAL se desplegó correctamente."
          echo "Usuario Linux: $(id -un)"
          echo "Carpeta activa: $(readlink -f "$ROOT/current")"
          echo "Imágenes persistentes: $SHARED_IMAGES (ITVAL_IMAGES_ROOT)"
          echo "Aplicación interna: http://localhost:3001/es"
          echo "Base de datos: itval_db"
          echo "Usuario PostgreSQL: itval_app"

          pm2 status
          REMOTE
